name: Lint

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Guard against hardcoded KON-managed origins
        run: bun run lint:origins

      - name: oxlint
        run: bun run lint

      - name: oxfmt (formatting)
        run: bun run format:check
