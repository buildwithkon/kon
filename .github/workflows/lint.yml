name: Lint

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Guard against hardcoded KON-managed origins
        run: pnpm run lint:origins

      - name: oxlint
        run: pnpm run lint

      - name: oxfmt (formatting)
        run: pnpm exec oxfmt --check .
