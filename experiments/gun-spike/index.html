<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KON GUN.js Spike</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
      h1 { font-size: 1.25rem; }
      .panel { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
      .panel h2 { font-size: 1rem; margin: 0 0 0.5rem; color: #444; }
      .row { display: flex; gap: 0.5rem; align-items: center; }
      input, button { font: inherit; padding: 0.4rem 0.6rem; border-radius: 6px; border: 1px solid #ccc; }
      button { cursor: pointer; background: #1a73e8; color: white; border-color: #1a73e8; }
      button:disabled { background: #999; border-color: #999; cursor: not-allowed; }
      input { flex: 1; }
      .messages { max-height: 400px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 0.85rem; }
      .msg { padding: 0.4rem 0.6rem; border-radius: 6px; margin-bottom: 0.3rem; background: #f5f5f5; }
      .msg.verified { border-left: 3px solid #0c7a3e; }
      .msg.unverified { border-left: 3px solid #c0392b; background: #fef0f0; }
      .meta { color: #888; font-size: 0.75rem; }
      .stats { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; font-family: ui-monospace, monospace; font-size: 0.85rem; }
      .stats dt { color: #666; }
      .stats dd { margin: 0; }
    </style>
  </head>
  <body>
    <h1>KON GUN.js + SEA spike</h1>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
